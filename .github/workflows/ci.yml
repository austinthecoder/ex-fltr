name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.14.5"
            otp: "25.3"
            ecto: "== 3.10.0"
          - elixir: "1.14.5"
            otp: "25.3"
            ecto: "~> 3.10"
          - elixir: "1.20"
            otp: "29"
            ecto: "== 3.10.0"
          - elixir: "1.20"
            otp: "29"
            ecto: "~> 3.10"

    env:
      MIX_ENV: test
      FLTR_ECTO_VERSION: ${{ matrix.ecto }}

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.unlock --all
      - run: mix deps.get
      - run: mix deps.compile

      - if: matrix.elixir == '1.20' && matrix.ecto == '~> 3.10'
        run: mix format --check-formatted

      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
